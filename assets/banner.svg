<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Radial Accents -->
    <radialGradient id="cyanGlow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#00d2ff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#9d4edd" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f2fe" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#9d4edd" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Top Neon Line Gradient -->
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect x="2" y="2" width="1196" height="336" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- Cyber Grid -->
  <rect x="2" y="2" width="1196" height="336" rx="20" ry="20" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <rect x="2" y="2" width="1196" height="336" rx="20" ry="20" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="1196" height="336" rx="20" ry="20" fill="url(#purpleGlow)" />
  <rect x="2" y="2" width="1196" height="336" rx="20" ry="20" fill="url(#bottomGlow)" />

  <!-- Glowing Card Border -->
  <rect x="2" y="2" width="1196" height="336" rx="20" ry="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Glowing Cyber Accent -->
  <line x1="120" y1="3" x2="1080" y2="3" stroke="url(#neonLine)" stroke-width="3" filter="url(#glowFilter)" />

  <!-- Role Status Pill -->
  <g transform="translate(415, 38)">
    <rect x="0" y="0" width="370" height="34" rx="17" ry="17" fill="#00d2ff" fill-opacity="0.1" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="22" cy="17" r="5" fill="#00e5ff" />
    <circle cx="22" cy="17" r="8" fill="#00e5ff" fill-opacity="0.3" />
    <text x="38" y="22" fill="#00e5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.8">SENIOR CLOUD &amp; DEVOPS ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="132" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="2.5">
    RANJEET KUMAR
  </text>

  <!-- Subtitle -->
  <text x="600" y="174" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.5">
    Architecting <tspan fill="#38bdf8" font-weight="700">Resilient Azure Infrastructure</tspan> • <tspan fill="#818cf8" font-weight="700">AKS Orchestration</tspan> • <tspan fill="#c084fc" font-weight="700">Terraform IaC</tspan> • <tspan fill="#fb923c" font-weight="700">ArgoCD GitOps</tspan>
  </text>

  <!-- Tag Badges Row -->
  <g transform="translate(130, 218)">
    <!-- Badge 1: Azure & AKS -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="215" height="42" rx="10" ry="10" fill="#0f172a" fill-opacity="0.85" stroke="#0078d4" stroke-opacity="0.6" stroke-width="1.2" />
      <!-- Azure Icon -->
      <path d="M 28 30 L 37 12 L 43 14 L 33 30 Z" fill="#0078d4" />
      <path d="M 33 30 L 41 24 L 46 12 L 42 27 Z" fill="#50e6ff" />
      <text x="56" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Azure &amp; AKS</text>
    </g>

    <!-- Badge 2: Terraform IaC -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="225" height="42" rx="10" ry="10" fill="#0f172a" fill-opacity="0.85" stroke="#844fba" stroke-opacity="0.6" stroke-width="1.2" />
      <!-- Terraform Icon Symbol -->
      <path d="M 27 15 L 34 19 L 34 27 L 27 23 Z" fill="#844fba" />
      <path d="M 36 20 L 43 24 L 43 32 L 36 28 Z" fill="#9d4edd" />
      <path d="M 36 12 L 43 16 L 43 19 L 36 15 Z" fill="#c084fc" />
      <text x="55" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Terraform (IaC)</text>
    </g>

    <!-- Badge 3: ArgoCD & Pipelines -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="230" height="42" rx="10" ry="10" fill="#0f172a" fill-opacity="0.85" stroke="#ef6b48" stroke-opacity="0.6" stroke-width="1.2" />
      <!-- Git Branch Icon -->
      <circle cx="32" cy="18" r="4" fill="#fb923c" />
      <circle cx="42" cy="26" r="4" fill="#fb923c" />
      <path d="M 32 22 L 32 28 M 32 22 Q 36 24 38 26" stroke="#fb923c" stroke-width="2" fill="none" />
      <text x="54" y="26" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">ArgoCD &amp; CI/CD</text>
    </g>

    <!-- Badge 4: DevSecOps & SRE -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="210" height="42" rx="10" ry="10" fill="#0f172a" fill-opacity="0.85" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.2" />
      <!-- Shield Icon -->
      <path d="M 32 14 L 26 17 L 26 23 C 26 27 32 30 32 30 C 32 30 38 27 38 23 L 38 17 Z" fill="#22c55e" />
      <text x="49" y="26" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">DevSecOps &amp; SRE</text>
    </g>
  </g>

  <!-- Subtle Bottom Bar with Tech Highlights -->
  <line x1="200" y1="290" x2="1000" y2="290" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <text x="600" y="315" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">
    ENTERPRISE CLOUD ARCHITECTURE • ZERO-DOWNTIME ROLLOUTS • 99.99% HIGH AVAILABILITY
  </text>
</svg>
